name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COOKIE_SECURE: "false"
  PORT: "3000"
  WEB_ORIGIN: http://127.0.0.1:5173
  DB_HOST: 127.0.0.1
  DB_PORT: "3306"
  DB_NAME: hidden_route
  DB_USER: hidden_route
  DB_PASSWORD: ci-only-database-password
  DB_ROOT_PASSWORD: ci-only-root-password
  JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
  ADMIN_NAME: Administrador CI
  ADMIN_EMAIL: admin-ci@hiddenroute.local
  ADMIN_PASSWORD: ci-only-admin-password

jobs:
  verify:
    name: Qualidade e segurança
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: hidden_route
          MYSQL_USER: hidden_route
          MYSQL_PASSWORD: ci-only-database-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pci-only-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Preparar banco isolado
        run: npm run db:migrate && npm run db:seed
      - name: Auditar dependências
        run: npm run security:check
      - name: Verificar projeto
        run: npm run check

  e2e:
    name: Fluxos ponta a ponta
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: hidden_route
          MYSQL_USER: hidden_route
          MYSQL_PASSWORD: ci-only-database-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pci-only-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Preparar banco isolado
        run: npm run db:migrate && npm run db:seed
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Executar Playwright
        run: npm run test:e2e
      - name: Preservar relatório em falhas
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
